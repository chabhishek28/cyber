<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surprise 3</title>
  <style>
    :root {
      --bg-1: #030807;
      --bg-2: #0a1f1b;
      --bg-3: #123527;
      --panel: rgba(12, 26, 22, 0.8);
      --green-1: #c9f7d4;
      --green-2: #85f0a7;
      --green-3: #43d37a;
      --green-4: #1d8a57;
      --green-5: #0d4d34;
      --choco-1: #4b2a22;
      --choco-2: #6c3a31;
      --choco-3: #8a5449;
      --strawberry-1: #ffbfd0;
      --strawberry-2: #ff8cab;
      --strawberry-3: #ff5f8d;
      --cream: #f4efe7;
      --gold: #ffd861;
      --gold-deep: #ffaf1c;
      --rose: #ff9db6;
      --sprinkle-1: #ff89b8;
      --sprinkle-2: #7cf0be;
      --sprinkle-3: #ffda63;
      --cookie: #d0a164;
      --gem: #7fe3ff;
      --glow: rgba(104, 230, 154, 0.45);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(100, 255, 171, 0.18), transparent 25%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 42%, var(--bg-3) 100%);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: min(92vw, 1000px);
      min-height: 700px;
      background: linear-gradient(180deg, rgba(15, 32, 28, 0.85), rgba(8, 15, 13, 0.7));
      border: 1px solid rgba(136, 255, 191, 0.18);
      border-radius: 36px;
      box-shadow: 0 0 0 1px rgba(160, 255, 200, 0.08), 0 32px 70px rgba(0, 0, 0, 0.42);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 18%, rgba(130, 255, 190, 0.2), transparent 23%),
        linear-gradient(180deg, transparent, rgba(60, 226, 131, 0.08));
      z-index: -1;
    }

    .title {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(2rem, 4vw, 4rem);
      color: var(--green-1);
      letter-spacing: 0.08em;
      font-family: Georgia, serif;
      text-align: center;
      width: 100%;
      z-index: 12;
      text-shadow: 0 0 18px rgba(122, 255, 160, 0.35);
    }

    .cake-stage {
      position: relative;
      width: min(82vw, 760px);
      height: 520px;
      margin-top: 110px;
      z-index: 2;
    }

    .cake-base-shadow {
      position: absolute;
      left: 50%;
      bottom: 52px;
      width: 520px;
      height: 28px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(40, 255, 132, 0.22) 0%, rgba(40, 255, 132, 0.08) 58%, transparent 100%);
      border-radius: 50%;
      z-index: 0;
    }

    .cake-layer {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 28px;
      box-shadow: inset 0 -10px 0 rgba(12, 9, 10, 0.25), 0 18px 28px rgba(0, 0, 0, 0.25);
      opacity: 0;
      animation: layerRise 1s ease forwards;
      z-index: 2;
      overflow: hidden;
    }

    .cake-layer::before {
      content: "";
      position: absolute;
      inset: 10px 14px auto 14px;
      height: 16px;
      border-radius: 40px;
      background: linear-gradient(180deg, rgba(255,255,255,0.32), rgba(255,255,255,0.04));
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.12);
    }

    .cake-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent 28%, transparent 72%, rgba(255,255,255,0.04));
      pointer-events: none;
    }

    .cake-name {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: Georgia, serif;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--green-5);
      background: linear-gradient(180deg, rgba(252,247,242,0.98), rgba(230, 213, 197, 0.9));
      border-radius: 999px;
      padding: 0.15rem 0.9rem;
      box-shadow: inset 0 0 0 1px rgba(90, 112, 95, 0.2), 0 10px 18px rgba(0, 0, 0, 0.12);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(63, 130, 90, 0.2);
      z-index: 6;
      user-select: none;
      width: fit-content;
      height: fit-content;
      margin: auto;
    }

    .layer-1 {
      bottom: 56px;
      width: 500px;
      height: 94px;
      background: linear-gradient(180deg, #8d5e4b 0%, #6e3e35 44%, #4a2b2a 100%);
      animation-delay: 0.15s;
    }

    .layer-2 {
      bottom: 128px;
      width: 390px;
      height: 82px;
      background: linear-gradient(180deg, #9b4d5d 0%, #7e3544 44%, #4d1f2d 100%);
      animation-delay: 0.5s;
    }

    .layer-3 {
      bottom: 186px;
      width: 280px;
      height: 74px;
      background: linear-gradient(180deg, #bb5e74 0%, #8b3e4d 44%, #4f2430 100%);
      animation-delay: 0.8s;
    }

    .layer-1 .cake-name { font-size: clamp(0.85rem, 1.1vw, 1.3rem); }
    .layer-2 .cake-name { font-size: clamp(0.72rem, 0.95vw, 1.1rem); }
    .layer-3 .cake-name { font-size: clamp(0.8rem, 1vw, 1.1rem); }

    .cream-layer {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 22px;
      background: linear-gradient(180deg, #fffafb 0%, #ffe6ee 42%, #ffd4e2 100%);
      box-shadow: inset 0 -10px 0 rgba(255, 162, 194, 0.18), 0 12px 18px rgba(255, 225, 235, 0.18);
      opacity: 0;
      animation: creamShow 1.2s ease forwards;
      z-index: 4;
    }

    .cream-1 { bottom: 132px; width: 340px; height: 12px; animation-delay: 0.8s; }
    .cream-2 { bottom: 206px; width: 270px; height: 10px; animation-delay: 1.1s; }
    .cream-3 { bottom: 252px; width: 200px; height: 9px; animation-delay: 1.35s; }

    .top-cream {
      position: absolute;
      left: 50%;
      bottom: 254px;
      width: 170px;
      height: 20px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #fffdfd 0%, #ffeef4 42%, #ffdde9 100%);
      border-radius: 18px;
      box-shadow: 0 16px 18px rgba(255, 124, 164, 0.18), inset 0 3px 0 rgba(255,255,255,0.7);
      z-index: 5;
      animation: creamGlow 1.8s ease-in-out infinite alternate;
    }

    .candle {
      position: absolute;
      bottom: 264px;
      width: 16px;
      height: 86px;
      border-radius: 10px;
      background: linear-gradient(180deg, #fff8d8 0%, #f2d862 100%);
      box-shadow: inset 0 -8px 0 rgba(180, 118, 18, 0.4), 0 0 12px rgba(255, 216, 97, 0.18);
      opacity: 1;
      z-index: 12;
      transform: translateX(0) translateY(0) scale(1);
      animation: none;
      left: var(--end-left, 50%);
    }

    .candle::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -24px;
      width: 22px;
      height: 28px;
      transform: translateX(-50%);
      border-radius: 50% 50% 42% 42%;
      background: radial-gradient(circle at 50% 35%, #fffef7 0%, #fff0a6 30%, #ffcc52 55%, #ff9d00 100%);
      box-shadow: 0 0 18px rgba(255, 204, 82, 0.9);
      animation: flameLift 0.8s ease-in-out infinite alternate;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .c1 { --start-left: 8%; --end-left: 40%; }
    .c2 { --start-left: 20%; --end-left: 49%; }
    .c3 { --start-left: 72%; --end-left: 58%; }

    .candle {
      opacity: 0;
      left: var(--start-left);
      animation: none;
    }

    .scene:not(.blowout) .candle {
      opacity: 1;
      animation: rocketFly 2.8s cubic-bezier(0.14, 0.8, 0.18, 1) forwards;
    }

    .scene.wish-activated .candle {
      opacity: 1;
      left: var(--end-left);
    }

    .scene.blowout .candle::before {
      opacity: 0;
      transform: translateX(-50%) scale(0.2);
    }

    .faller {
      position: absolute;
      top: -40px;
      left: var(--left, 50%);
      opacity: 0;
      z-index: 18;
      --dx: 0px;
      --dy: 150px;
      --rot: 0deg;
    }

    .scene.wish-activated .faller {
      animation: fallAcross 2.8s ease-in forwards;
    }

    .f1 { --left: 22%; --dx: 32px; --dy: 300px; --rot: 160deg; animation-delay: 0.1s; }
    .f2 { --left: 26%; --dx: 60px; --dy: 310px; --rot: 210deg; animation-delay: 0.3s; }
    .f3 { --left: 31%; --dx: 90px; --dy: 340px; --rot: 300deg; animation-delay: 0.5s; }
    .f4 { --left: 38%; --dx: 52px; --dy: 290px; --rot: 120deg; animation-delay: 0.9s; }
    .f5 { --left: 43%; --dx: 82px; --dy: 340px; --rot: 200deg; animation-delay: 1.2s; }
    .f6 { --left: 49%; --dx: 54px; --dy: 280px; --rot: 240deg; animation-delay: 0.7s; }
    .f7 { --left: 56%; --dx: 75px; --dy: 330px; --rot: 120deg; animation-delay: 1.4s; }
    .f8 { --left: 61%; --dx: 100px; --dy: 295px; --rot: 260deg; animation-delay: 0.2s; }
    .f9 { --left: 68%; --dx: 86px; --dy: 330px; --rot: 140deg; animation-delay: 0.8s; }
    .f10 { --left: 74%; --dx: 58px; --dy: 280px; --rot: 300deg; animation-delay: 0.5s; }
    .f11 { --left: 18%; --dx: 40px; --dy: 320px; --rot: 230deg; animation-delay: 1.1s; }
    .f12 { --left: 84%; --dx: -20px; --dy: 300px; --rot: 100deg; animation-delay: 1.7s; }

    .sprinkle {
      display: block;
      width: 14px;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--sprinkle-1), var(--sprinkle-2), var(--sprinkle-3));
      box-shadow: 0 0 12px rgba(187, 255, 206, 0.24);
    }

    .cookie {
      display: block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f3dcb0 0%, var(--cookie) 36%, #ab7a42 100%);
      box-shadow: inset -4px -4px 0 rgba(122, 85, 36, 0.2), 0 0 12px rgba(255, 196, 90, 0.14);
      border: 2px solid rgba(106, 72, 39, 0.35);
    }

    .gem {
      display: block;
      width: 12px;
      height: 12px;
      background: linear-gradient(135deg, #d5faff, var(--gem));
      transform: rotate(45deg);
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(127, 227, 255, 0.35);
    }

    @keyframes fallAcross {
      0% {
        opacity: 0;
        transform: translate3d(0, -30px, 0) scale(0.4) rotate(0deg);
      }
      18% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: translate3d(var(--dx), var(--dy), 0) scale(1) rotate(var(--rot));
      }
    }

    .sparkle {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
      box-shadow: 0 0 14px rgba(255,255,255,0.7);
      opacity: 0;
      z-index: 16;
    }

    .scene.wish-activated .sparkle {
      animation: sparklePop 1.8s ease-in-out infinite;
    }

    .s1 { left: 28%; top: 32%; }
    .s2 { left: 62%; top: 22%; animation-delay: 0.6s; }
    .s3 { left: 72%; top: 38%; animation-delay: 1.2s; }
    .s4 { left: 30%; top: 54%; animation-delay: 1.8s; }

    .wish-button {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      border: none;
      border-radius: 999px;
      padding: 0.85rem 1.8rem;
      background: linear-gradient(135deg, #7def9f 0%, #2db36b 100%);
      color: #07170f;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 18px 28px rgba(40, 160, 87, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      z-index: 20;
    }

    .wish-button:hover {
      transform: translateX(-50%) translateY(-2px);
      box-shadow: 0 22px 30px rgba(40, 160, 87, 0.35);
    }

    .wish-button:disabled {
      cursor: default;
      opacity: 0.9;
    }

    .wish-message {
      position: absolute;
      left: 50%;
      bottom: 88px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(13, 33, 25, 0.84);
      border: 1px solid rgba(136, 255, 191, 0.18);
      color: var(--green-1);
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 0.55rem 1.25rem;
      border-radius: 999px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 20;
      white-space: nowrap;
    }

    .wish-message.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;
      background: rgba(13, 33, 25, 0.85);
      color: var(--green-1);
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.35);
      z-index: 20;
    }

    .home-btn {
      position: absolute;
      bottom: 22px;
      right: 22px;
      border: none;
      background: rgba(13, 33, 25, 0.85);
      color: var(--green-1);
      padding: 0.8rem 1.4rem;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.28);
      z-index: 20;
    }

    @keyframes layerRise {
      0% { opacity: 0; transform: translateX(-50%) translateY(90px) scale(0.8); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }

    @keyframes creamShow {
      0% { opacity: 0; transform: translateX(-50%) scaleX(0.7); }
      100% { opacity: 1; transform: translateX(-50%) scaleX(1); }
    }

    @keyframes creamGlow {
      0% { transform: translateX(-50%) scaleY(1); box-shadow: 0 16px 18px rgba(112, 208, 120, 0.18); }
      100% { transform: translateX(-50%) scaleY(1.08); box-shadow: 0 22px 18px rgba(112, 208, 120, 0.28); }
    }

    @keyframes flameLift {
      0% { transform: translateX(-50%) scale(0.9); }
      100% { transform: translateX(-50%) scale(1.2); }
    }

    @keyframes rocketFly {
      0% {
        opacity: 0;
        left: var(--start-left);
        bottom: 20px;
        transform: translate(-260px, 100px) scale(0.2) rotate(-28deg);
      }
      18% {
        opacity: 1;
      }
      42% {
        opacity: 1;
        left: calc(var(--start-left) + 10%);
        bottom: 180px;
        transform: translate(40px, -50px) scale(0.92) rotate(-4deg);
      }
      68% {
        opacity: 1;
        left: calc(var(--end-left) - 5%);
        bottom: 320px;
        transform: translate(140px, -180px) scale(1.22) rotate(18deg);
      }
      100% {
        opacity: 1;
        left: var(--end-left);
        bottom: 264px;
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
    }

    @keyframes sparklePop {
      0%, 100% { transform: scale(0.4); opacity: 0; }
      35% { opacity: 1; }
      50% { transform: scale(1.2); opacity: 1; }
      65% { transform: scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="scene" id="cakeScene">
    <button class="close-btn" type="button" aria-label="Close surprise" onclick="window.location.href='demo.html?skipIntro=1#video-section'">×</button>
    <div class="title">Happy Birthday</div>

    <div class="cake-stage" aria-label="Birthday cake surprise animation">
      <div class="cake-base-shadow"></div>

      <div class="cake-layer layer-1">
        <div class="cake-name">JYOTHI</div>
      </div>
      <div class="cake-layer layer-2">
        <div class="cake-name">BIRTHDAY</div>
      </div>
      <div class="cake-layer layer-3">
        <div class="cake-name">HAPPY</div>
      </div>

      <div class="cream-layer cream-1"></div>
      <div class="cream-layer cream-2"></div>
      <div class="cream-layer cream-3"></div>
      <div class="top-cream"></div>

      <div class="candle c1"></div>
      <div class="candle c2"></div>
      <div class="candle c3"></div>

      <div class="faller sprinkle f1"></div>
      <div class="faller sprinkle f2"></div>
      <div class="faller sprinkle f3"></div>
      <div class="faller sprinkle f4"></div>
      <div class="faller sprinkle f5"></div>
      <div class="faller sprinkle f6"></div>
      <div class="faller sprinkle f7"></div>
      <div class="faller sprinkle f8"></div>
      <div class="faller sprinkle f9"></div>
      <div class="faller sprinkle f10"></div>
      <div class="faller cookie f11"></div>
      <div class="faller gem f12"></div>

      <div class="sparkle s1"></div>
      <div class="sparkle s2"></div>
      <div class="sparkle s3"></div>
      <div class="sparkle s4"></div>
    </div>

    <div id="wishMessage" class="wish-message">Happy Birthday Jyo</div>
    <button id="wishButton" class="wish-button" type="button">Make a Wish</button>
    <button class="home-btn" onclick="window.location.href='demo.html?skipIntro=1#video-section'">Return Home</button>
  </div>

  <script>
    const cakeScene = document.getElementById('cakeScene');
    const wishButton = document.getElementById('wishButton');
    const wishMessage = document.getElementById('wishMessage');

    wishButton.addEventListener('click', () => {
      cakeScene.classList.add('wish-activated');
      cakeScene.classList.add('blowout');
      wishButton.disabled = true;
      wishButton.textContent = 'Wished ✨';

      setTimeout(() => {
        wishMessage.classList.add('visible');
      }, 500);
    });
  </script>
</body>
</html>
